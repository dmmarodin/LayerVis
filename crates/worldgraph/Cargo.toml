[package]
name = "worldgraph"
version = "0.1.0"
edition = "2021"
description = "World-generation node graphs on LayerGen: file format, node kinds, world models, pipeline building."

[dependencies]
layergen = { package = "layergen-rs", path = "../../../LayerGen" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rhai = { version = "1", features = ["sync"], optional = true }

[dev-dependencies]
bevy_app = "0.20"

[features]
default = ["scripting"]
# Rhai script nodes. Without it, script nodes load but report as blocked.
scripting = ["dep:rhai"]
